name: Codex rootless iOS releases

on:
  schedule:
    - cron: '54 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Stable upstream tag, or leave blank to check for all missing versions
        type: string

concurrency:
  group: rootless-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.versions.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test package revision discovery and publication
        run: python3 -m unittest discover -s scripts -p 'test_rootless_release.py'
      - name: Find unpublished stable versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: python3 scripts/sync-rootless-releases.py discover

  build:
    needs: discover
    if: ${{ needs.discover.outputs.pending != '[]' }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.pending) }}
    name: Build Codex ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install package tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install dpkg ldid
      - name: Build and package the iOS binaries
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ matrix.tag }}
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT
          python3 scripts/build-rootless-release.py "$UPSTREAM_TAG" release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootless-${{ matrix.version }}
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rootless-*
          path: release-artifacts
      - name: Publish completed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-rootless-releases.py publish release-artifacts
